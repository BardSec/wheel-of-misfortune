<!doctype html>
<!-- Link-preview image for cvegenerator.bardsec.com. Render with og/render.sh. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../cvegen/public/styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 520px; gap: 40px; align-items: center; padding: 0 64px 0 72px; min-height: 0; }
  .brand-sm { font: 700 20px var(--mono); letter-spacing: .14em; color: var(--muted); margin: 0 0 18px; }
  h1 { font-size: 88px; line-height: .95; text-align: left; margin: 0 0 26px; }
  .tag { font: 26px var(--mono); color: var(--muted); margin: 0; line-height: 1.4; }
  .card { padding: 34px 28px 28px; transform: rotate(2deg); }
  .logo { width: 120px; height: 120px; font-size: 66px; }
  .card h2 { font-size: 54px; }
  .chip { font-size: 18px; padding: 6px 12px; }
  .desc { font-size: 20px; margin: 20px auto 0; }
</style></head>
<body>
  <div>
    <p class="brand-sm">BARDSEC</p>
    <h1>CVE Name<br><span class="accent">Generator</span></h1>
    <p class="tag">Enter your name.<br>Get a vulnerability with a logo,<br>a website, and no patch.</p>
  </div>
  <article class="card">
    <div class="logo">🦆</div>
    <p class="kicker">Introducing</p>
    <h2>SMBarrassment</h2>
    <div class="chips"><span class="chip">CVE-2027-133742</span><span class="chip sev">CVSS 10.0</span></div>
    <p class="desc">Allows an unauthenticated intern to reply-all to the entire organization via a cursed PDF.</p>
  </article>
</body></html>
