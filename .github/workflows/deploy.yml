name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The bardsec.com zone tells browsers to cache JS/CSS for 4h, but HTML is always revalidated.
      # Stamping asset URLs with the commit SHA makes every deploy fetch fresh JS/CSS
      # (otherwise new HTML + stale JS breaks the page until a hard refresh).
      - name: Cache-bust asset URLs
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" public/index.html cvegen/public/index.html

      - name: Deploy wheel.bardsec.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=wheel-of-misfortune --branch=main

      # Runs from cvegen/ so Wrangler picks up cvegen/functions (the link-preview rewriter).
      - name: Deploy cvegenerator.bardsec.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cvegen
          command: pages deploy public --project-name=cve-name-generator --branch=main
